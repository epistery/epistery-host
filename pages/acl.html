<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Control - {{server.contractAddress}}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            overflow: hidden;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            font-size: 14px;
            background: #fff;
            color: #333;
            display: flex;
            flex-direction: column;
        }
        #container {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
            padding: 16px;
        }
        #tableWrapper {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 3px;
            min-height: 150px;
            margin-bottom: 12px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #fff;
        }
        #aclBody TR>TD:first-child {
            width: 100%;
        }
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        th {
            background: #f5f5f5;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            color: #666;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        td:first-child {
            width: 50%;
        }
        tr:hover {
            background: #f9f9f9;
        }
        .actions {
            display: flex;
            gap: 8px;
        }
        button {
            padding: 4px 12px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            border-radius: 3px;
            font-size: 12px;
            min-width:60px;
        }
        button:hover {
            background: #f5f5f5;
        }
        button.save {
            background: #2d5016;
            color: #fff;
            border-color: #2d5016;
        }
        button.save:hover {
            background: #3d6020;
        }
        button.delete {
            background: #c0392b;
            color: #fff;
            border-color: #c0392b;
        }
        button.delete:hover {
            background: #e74c3c;
        }
        input, select {
            padding: 6px 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            font-size: 13px;
            font-family: inherit;
        }
        .add-row {
            margin-top: 12px;
            padding: 12px;
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 3px;
            flex-shrink: 0;
        }
        .add-row input {
            margin-right: 8px;
        }
        .error {
            color: #c0392b;
            margin-bottom: 8px;
            font-size: 12px;
            flex-shrink: 0;
        }
        .loading {
            text-align: center;
            padding: 24px;
            color: #999;
        }
        .editing input {
            width: 100%;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .public-row {
            background: #fffef0;
        }
        .public-row:hover {
            background: #fffce0;
        }
        .public-badge {
            display: inline-block;
            padding: 2px 6px;
            background: #f0ad4e;
            color: #fff;
            border-radius: 3px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            margin-left: 6px;
        }
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(0,0,0,0.1);
            border-top-color: #333;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
        }
        button.save .spinner {
            border-color: rgba(255,255,255,0.3);
            border-top-color: #fff;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading" class="loading">Loading...</div>
        <div id="error" class="error" style="display:none;"></div>
        <div id="tableWrapper" style="display:none;">
            <table id="aclTable">
                <thead>
                    <tr>
                        <th style="min-width:100%">List Name</th>
                        <th style="min-width:80px">Access</th>
                        <th style="min-width:80px">Actions</th>
                    </tr>
                </thead>
                <tbody id="aclBody">
                </tbody>
            </table>
        </div>
        <div id="authStrategy" style="display:none; margin-top: 8px;justify-content: space-between">
            <div style="margin-bottom: 12px;">
                <label>
                    <input type="checkbox" id="enableRequestAccess" onchange="markDirty()">
                    Enable "Request Access" button for denied users
                </label>
            </div>
            <div>
                <button id="saveAllBtn" onclick="saveAll()" class="save">Save</button>
            </div>
        </div>
    </div>

    <script>
        let acls = [];
        let availableLists = [];
        let authConfig = {
            enableRequestAccess: false
        };
        // parse query string
        let queryString = window.location.search.slice(1).split('&').reduce((a,c)=>{
          let parts = c.split('=');
          a[parts[0]] = parts[1];
          return a;
        },{});
        const agentName = queryString.agent;

        // Access level mapping
        const accessLevels = {
            0: 'None',
            1: 'Read',
            2: 'Write',
            3: 'Admin'
        };

        async function loadACLs() {
            try {
                const [aclResponse, listResponse] = await Promise.all([
                    fetch('/api/acl/agent/' + encodeURIComponent(agentName)),
                    fetch('/api/acl/list')
                ]);
                if (!aclResponse.ok) throw new Error('Failed to load ACLs');

                const data = await aclResponse.json();
                acls = data.acl || [];
                authConfig = data.authConfig || authConfig;

                if (listResponse.ok) {
                    const listData = await listResponse.json();
                    availableLists = listData.lists || [];
                }

                isDirty = false;
                renderACLs();
                renderAuthConfig();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('tableWrapper').style.display = 'block';
                document.getElementById('authStrategy').style.display = 'flex';
                // Disable save button initially (no changes yet)
                const saveBtn = document.getElementById('saveAllBtn');
                if (saveBtn) saveBtn.disabled = true;
            } catch (err) {
                showError('Error loading ACLs: ' + err.message);
            }
        }

        function renderAuthConfig() {
            // Set request access checkbox
            document.getElementById('enableRequestAccess').checked = authConfig.enableRequestAccess || false;
        }

        async function saveAll() {
            if (!isDirty) {
                return; // No changes to save
            }

            const saveBtn = document.getElementById('saveAllBtn');
            const originalText = saveBtn.innerHTML;
            saveBtn.disabled = true;
            saveBtn.innerHTML = '<span class="spinner"></span>';

            try {
                // Save ACLs and auth config in one transaction
                const enableRequest = document.getElementById('enableRequestAccess').checked;
                authConfig = { enableRequestAccess: enableRequest };

                const aclResponse = await fetch('/api/acl/agent', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent: agentName, acl: acls, authConfig })
                });

                if (!aclResponse.ok) {
                    const error = await aclResponse.json();
                    throw new Error(error.error || 'Failed to save');
                }

                isDirty = false;
                saveBtn.innerHTML = 'Saved!';
                setTimeout(() => {
                    saveBtn.innerHTML = originalText;
                    saveBtn.disabled = true; // Disable again when no changes
                }, 2000);
                renderACLs(); // Re-render to clean up edit mode
                showError(''); // Clear any errors
            } catch (err) {
                showError('Error saving: ' + err.message);
                saveBtn.innerHTML = originalText;
                saveBtn.disabled = false;
            }
        }

        function buildListOptions(selectedValue) {
            // Combine available lists with 'default', deduplicate
            const usedLists = acls.map(a => a.list);
            const allLists = [...new Set(['default', ...availableLists])];
            // Filter out lists already in use (unless it's the selected value for edit)
            const options = allLists.filter(l => l === selectedValue || !usedLists.includes(l));
            return options.map(l =>
                `<option value="${escapeHtml(l)}" ${l === selectedValue ? 'selected' : ''}>${escapeHtml(l)}</option>`
            ).join('');
        }

        function renderACLs() {
            const tbody = document.getElementById('aclBody');
            tbody.innerHTML = '';

            acls.forEach((acl, index) => {
                const tr = document.createElement('tr');
                tr.id = 'row-' + index;
                const accessLevel = parseInt(acl.access);
                const isDefault = acl.list === 'default';

                if (isDefault) tr.classList.add('public-row');

                tr.innerHTML = `
                    <td class="list-name">
                        ${escapeHtml(acl.list)}
                        ${isDefault ? '<span class="public-badge">Default</span>' : ''}
                    </td>
                    <td class="access-level">${accessLevels[accessLevel] || 'Unknown'}</td>
                    <td class="actions">
                        <button onclick="editACL(${index})">Edit</button>
                        <button onclick="deleteACL(${index})" class="delete">Delete</button>
                    </td>
                `;
                tbody.appendChild(tr);
            });

            // Add "Add" row at the end
            const addRow = document.createElement('tr');
            addRow.innerHTML = `
                <td>
                    <select id="newList" style="width: 100%;">
                        <option value="">-- Select list --</option>
                        ${buildListOptions(null)}
                    </select>
                </td>
                <td>
                    <select id="newAccess" style="width: 100%;">
                        <option value="0">None</option>
                        <option value="1">Read</option>
                        <option value="2">Write</option>
                        <option value="3">Admin</option>
                    </select>
                </td>
                <td class="actions">
                    <button onclick="addACL()" class="save">Add</button>
                </td>
            `;
            tbody.appendChild(addRow);
        }

        function editACL(index) {
            const tr = document.getElementById('row-' + index);
            const acl = acls[index];
            const accessLevel = parseInt(acl.access);

            tr.classList.add('editing');
            tr.innerHTML = `
                <td>
                    <select id="edit-list-${index}" style="width: 100%;">
                        ${buildListOptions(acl.list)}
                    </select>
                </td>
                <td>
                    <select id="edit-access-${index}">
                        <option value="0" ${accessLevel === 0 ? 'selected' : ''}>None</option>
                        <option value="1" ${accessLevel === 1 ? 'selected' : ''}>Read</option>
                        <option value="2" ${accessLevel === 2 ? 'selected' : ''}>Write</option>
                        <option value="3" ${accessLevel === 3 ? 'selected' : ''}>Admin</option>
                    </select>
                </td>
                <td class="actions">
                    <button onclick="saveACL(${index})" class="save">Save</button>
                    <button onclick="cancelEdit(${index})">Cancel</button>
                </td>
            `;
        }

        async function saveACL(index) {
            const list = document.getElementById('edit-list-' + index).value.trim();
            const access = parseInt(document.getElementById('edit-access-' + index).value);

            if (!list) {
                showError('List name cannot be empty');
                return;
            }

            acls[index] = { list, access };
            markDirty();
            renderACLs();
        }

        function cancelEdit(index) {
            renderACLs();
        }

        async function addACL() {
            const list = document.getElementById('newList').value;
            const access = parseInt(document.getElementById('newAccess').value);

            if (!list) {
                showError('Please select a list');
                return;
            }

            // Check for duplicates
            if (acls.some(acl => acl.list === list)) {
                showError('List already exists');
                return;
            }

            acls.push({ list, access });
            markDirty();

            // Clear inputs
            document.getElementById('newList').value = '';
            document.getElementById('newAccess').value = '1';

            renderACLs();
        }

        async function deleteACL(index) {
            if (!confirm('Delete this ACL entry?')) return;

            acls.splice(index, 1);
            markDirty();
            renderACLs();
        }

        let isDirty = false;
        function markDirty() {
            isDirty = true;
            const saveBtn = document.getElementById('saveAllBtn');
            if (saveBtn) {
                saveBtn.disabled = false;
            }
        }


        function showError(msg) {
            const errorDiv = document.getElementById('error');
            if (msg) {
                errorDiv.textContent = msg;
                errorDiv.style.display = 'block';
                document.getElementById('loading').style.display = 'none';
            } else {
                errorDiv.style.display = 'none';
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Load on page load
        if (agentName) loadACLs();
        else showError("'Agent' Name is required in query string");
    </script>
</body>
</html>
