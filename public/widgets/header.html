<nav>
  <a href="/?home" class="logo">
    <img alt="logo" src="/image/epistery-logo-32.svg" class="logo-window">
  </a>
  <div id="header-controls">
    <span class="nav-menu" id="header-nav-menu"></span>
    <a title="Identity" class="identity-icon" href="/status">👤</a>
  </div>
  <div id="mobile-controls">
    <button class="hamburger" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div id="side-bar">
      <a title="Identity" class="identity-icon" href="/status">👤</a>
      <span class="nav-menu" id="mobile-nav-menu"></span>
      <!-- Slot for agent-provided mobile content (e.g. wiki index, channel list) -->
      <div id="header-sidebar-content"></div>
    </div>
  </div>
</nav>

<script>
(async function() {
  try {
    const response = await fetch('/api/nav-menu');
    const html = await response.text();
    const desktop = document.getElementById('header-nav-menu');
    const mobile = document.getElementById('mobile-nav-menu');
    if (desktop) desktop.innerHTML = html;
    if (mobile) mobile.innerHTML = html;
  } catch (e) {
    console.error('[header] Failed to load nav menu:', e);
  }

  const hamburger = document.querySelector('#mobile-controls .hamburger');
  const sideBar = document.getElementById('side-bar');

  if (hamburger && sideBar) {
    hamburger.addEventListener('click', (e) => {
      e.stopPropagation();
      hamburger.classList.toggle('active');
      sideBar.classList.toggle('active');
    });

    document.addEventListener('click', (e) => {
      if (!sideBar.contains(e.target) && !hamburger.contains(e.target)) {
        hamburger.classList.remove('active');
        sideBar.classList.remove('active');
      }
    });

    sideBar.addEventListener('click', (e) => e.stopPropagation());
  }

  document.dispatchEvent(new CustomEvent('header-ready'));
})();
</script>
