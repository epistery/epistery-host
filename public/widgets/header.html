<div class="epistery-float-nav">
    <button class="epistery-float-btn" aria-label="Epistery">
        <img src="/image/epistery-logo-32.svg" alt="Epistery">
    </button>
    <div class="epistery-float-dropdown" id="float-nav-dropdown">
        <a href="/?home" class="epistery-float-item">Home</a>
        <div id="float-nav-agents"></div>
    </div>
</div>

<!-- Preserve mobile sidebar for agent content (e.g. wiki index) -->
<div id="mobile-controls">
    <button class="hamburger" aria-label="Menu">
        <span></span>
        <span></span>
        <span></span>
    </button>
    <div id="side-bar">
        <div id="header-sidebar-content"></div>
    </div>
</div>

<script>
(async function() {
    const floatBtn = document.querySelector('.epistery-float-btn');
    const dropdown = document.getElementById('float-nav-dropdown');
    const agentsContainer = document.getElementById('float-nav-agents');

    // Toggle dropdown on click
    if (floatBtn && dropdown) {
        floatBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('open');
        });

        // Close on outside click
        document.addEventListener('click', (e) => {
            if (!dropdown.contains(e.target) && !floatBtn.contains(e.target)) {
                dropdown.classList.remove('open');
            }
        });
    }

    // Load agent links into dropdown
    try {
        const response = await fetch('/api/nav-menu');
        const html = await response.text();
        // The nav-menu returns <a> tags with icons and spans
        // Wrap them with float-item class
        if (agentsContainer) {
            const temp = document.createElement('div');
            temp.innerHTML = html;
            const links = temp.querySelectorAll('a');
            for (const link of links) {
                link.classList.add('epistery-float-item');
                agentsContainer.appendChild(link);
            }
        }
    } catch (e) {
        console.error('[header] Failed to load nav menu:', e);
    }

    // Mobile sidebar (hamburger) - independent of floating nav
    const hamburger = document.querySelector('#mobile-controls .hamburger');
    const sideBar = document.getElementById('side-bar');

    if (hamburger && sideBar) {
        hamburger.addEventListener('click', (e) => {
            e.stopPropagation();
            hamburger.classList.toggle('active');
            sideBar.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!sideBar.contains(e.target) && !hamburger.contains(e.target)) {
                hamburger.classList.remove('active');
                sideBar.classList.remove('active');
            }
        });

        sideBar.addEventListener('click', (e) => e.stopPropagation());
    }

    document.dispatchEvent(new CustomEvent('header-ready'));
})();
</script>
