<style>
    .agent-grid {
        display: flex;
        flex-direction: column;
        gap: var(--spacer);
    }
    .agent-card {
        display: flex;
        align-items: center;
        gap: var(--spacer);
        padding: var(--spacer);
        border: 2px solid var(--rust-deep);
        border-radius: 12px;
        text-decoration: none;
        color: var(--text-color);
        transition: background 0.2s;
    }
    .agent-card:hover {
        background: var(--bg-color-quiet-d);
    }
    .agent-card.open-access {
        border-color: var(--secondary);
        background: #f0f8f0;
    }
    .agent-card.open-access:hover {
        background: #e4f0e4;
    }
    .agent-card img {
        width: 24px;
        height: 24px;
        object-fit: contain;
        flex-shrink: 0;
    }
    .agent-card-icon-placeholder {
        width: 24px;
        height: 24px;
        background: var(--bg-color-d);
        border-radius: 4px;
        flex-shrink: 0;
    }
    .agent-card-info {
        flex: 1;
        min-width: 0;
    }
    .agent-card-title {
        font-weight: 500;
        font-size: 0.95rem;
    }
    .agent-card-desc {
        font-size: 0.8rem;
        color: var(--text-color-quiet);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .agent-card-badge {
        font-size: 0.7rem;
        padding: 2px 8px;
        border-radius: 10px;
        font-weight: 500;
        flex-shrink: 0;
        white-space: nowrap;
    }
    .badge-open {
        background: var(--secondary);
        color: white;
    }
    .badge-locked {
        background: var(--bg-color-d);
        color: var(--text-color-quiet);
    }
    .agent-cards-heading {
        font-size: 1.2rem;
        color: var(--primary);
        margin-bottom: var(--spacer);
    }
    .agent-cards-empty {
        color: var(--text-color-quiet);
        font-style: italic;
        padding: var(--spacer2) 0;
    }

</style>

<h2 class="agent-cards-heading">Services</h2>
<div class="agent-grid" id="agent-cards-grid">
    <div class="agent-cards-empty">Loading agents...</div>
</div>

<script>
(async function() {
    const grid = document.getElementById('agent-cards-grid');
    let isAdmin = false;

    // Check admin status
    try {
        const res = await fetch('/api/acl/check-admin', {
            credentials: 'include',
            headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        isAdmin = !!data.isAdmin;
    } catch (e) {}

    // Fetch agents
    try {
        const res = await fetch('/api/agents');
        const data = await res.json();

        if (!data.agents || data.agents.length === 0) {
            grid.innerHTML = '<div class="agent-cards-empty">No agents currently active.</div>';
            return;
        }

        // Fetch ACL info for all agents in parallel
        const aclPromises = data.agents
            .filter(a => !a.noUserInterface)
            .map(async agent => {
                try {
                    const aclRes = await fetch(`/api/acl/agent/${encodeURIComponent(agent.name)}`);
                    if (aclRes.ok) {
                        agent._acl = await aclRes.json();
                    }
                } catch (e) {}

                // Also check current user's access
                try {
                    const accessRes = await fetch(`/api/acl/check-access?agent=${encodeURIComponent(agent.name)}`, {
                        credentials: 'include'
                    });
                    if (accessRes.ok) {
                        agent._access = await accessRes.json();
                    }
                } catch (e) {}

                return agent;
            });

        await Promise.all(aclPromises);

        grid.innerHTML = '';

        for (const agent of data.agents) {
            if (agent.noUserInterface) continue;

            const acl = agent._acl?.acl || [];
            const userAccess = agent._access || {};

            // Determine if agent has open access (default list access > 0)
            const defaultEntry = acl.find(e => e.list === 'default');
            const isOpen = defaultEntry && defaultEntry.access > 0;
            const hasAccess = userAccess.level > 0;

            const a = document.createElement('a');
            a.className = 'agent-card' + (isOpen ? ' open-access' : '');
            a.href = agent.homepage || agent.shortPath;

            if (agent.icon) {
                const img = document.createElement('img');
                img.src = agent.icon;
                img.alt = agent.title || agent.simpleName;
                a.appendChild(img);
            } else {
                const placeholder = document.createElement('div');
                placeholder.className = 'agent-card-icon-placeholder';
                a.appendChild(placeholder);
            }

            const info = document.createElement('div');
            info.className = 'agent-card-info';

            const title = document.createElement('span');
            title.className = 'agent-card-title';
            title.textContent = agent.title || agent.simpleName;
            info.appendChild(title);

            if (agent.description) {
                const desc = document.createElement('div');
                desc.className = 'agent-card-desc';
                desc.textContent = agent.description;
                info.appendChild(desc);
            }

            a.appendChild(info);

            // Access badge — host-level access is requested via the requestAccess widget on the home page
            if (isOpen) {
                const badge = document.createElement('span');
                badge.className = 'agent-card-badge badge-open';
                badge.textContent = 'Open';
                a.appendChild(badge);
            } else if (hasAccess || isAdmin) {
                // User already has access, no badge needed
            } else {
                const badge = document.createElement('span');
                badge.className = 'agent-card-badge badge-locked';
                badge.textContent = 'Restricted';
                a.appendChild(badge);
            }

            grid.appendChild(a);
        }

        // Administrate card for admins
        if (isAdmin) {
            const a = document.createElement('a');
            a.className = 'agent-card';
            a.href = '/admin';

            const img = document.createElement('img');
            img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%232d5016'%3E%3Cpath d='M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.37-2.65A.506.506 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.37 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.06.74 1.69.99l.37 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.37-2.65c.63-.26 1.17-.59 1.69-.99l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64z'/%3E%3C/svg%3E";
            img.alt = 'Administrate';
            a.appendChild(img);

            const info = document.createElement('div');
            info.className = 'agent-card-info';
            const title = document.createElement('span');
            title.className = 'agent-card-title';
            title.textContent = 'Administrate';
            info.appendChild(title);
            a.appendChild(info);

            grid.appendChild(a);
        }

    } catch (e) {
        console.error('[agent-cards] Failed to load agents:', e);
        grid.innerHTML = '<div class="agent-cards-empty">Failed to load agents.</div>';
    }
})();
</script>
